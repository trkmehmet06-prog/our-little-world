<!DOCTYPE html>
<!-- Our Little World -->

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mişa | Our Little World</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#fff8f2,#f5f0ff);
  color:#292332;
  min-height:100vh;
}

.app{
  max-width:520px;
  margin:auto;
  padding-bottom:30px;
}

.header{
  padding:24px 18px 10px;
}

.header h1{
  margin:0;
  font-size:29px;
}

.header p{
  margin:5px 0 0;
  opacity:.6;
}

.card{
  margin:12px 16px;
  padding:18px;
  background:rgba(255,255,255,.9);
  border-radius:24px;
  box-shadow:0 10px 30px rgba(40,25,60,.08);
}

/* =========================
   MİŞA
========================= */

.pet-area{
  height:320px;
  position:relative;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

.floor{
  position:absolute;
  bottom:25px;
  width:220px;
  height:34px;
  border-radius:50%;
  background:rgba(50,35,60,.08);
}

.cat{
  position:relative;
  width:180px;
  height:205px;
  z-index:2;
  animation:catFloat 2.6s ease-in-out infinite;
}

@keyframes catFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.ear{
  position:absolute;
  width:50px;
  height:62px;
  top:7px;
  background:#d59a70;
  border-radius:70% 20% 30% 20%;
  z-index:2;
}

.ear.left{
  left:20px;
  transform:rotate(-25deg);
}

.ear.right{
  right:20px;
  transform:scaleX(-1) rotate(-25deg);
}

.ear:after{
  content:"";
  position:absolute;
  inset:10px;
  background:#f3b6b1;
  border-radius:70% 20% 30% 20%;
}

.head{
  position:absolute;
  left:22px;
  top:31px;
  width:136px;
  height:126px;
  border-radius:48% 48% 45% 45%;
  background:linear-gradient(145deg,#f0c39f,#c98961);
  box-shadow:inset -8px -8px 0 rgba(100,50,20,.08);
  z-index:3;
}

.eye{
  position:absolute;
  top:45px;
  width:17px;
  height:23px;
  background:#292332;
  border-radius:50%;
  animation:blink 5s infinite;
}

.eye.left{left:38px}
.eye.right{right:38px}

@keyframes blink{
  0%,92%,100%{transform:scaleY(1)}
  94%{transform:scaleY(.08)}
}

.eye:after{
  content:"";
  position:absolute;
  width:5px;
  height:5px;
  background:#fff;
  border-radius:50%;
  top:4px;
  left:4px;
}

.nose{
  position:absolute;
  top:71px;
  left:61px;
  width:14px;
  height:10px;
  background:#9d5360;
  border-radius:50%;
}

.mouth{
  position:absolute;
  top:81px;
  left:59px;
  width:18px;
  height:12px;
  border-bottom:2px solid #59383b;
  border-radius:50%;
}

.whisker{
  position:absolute;
  width:43px;
  height:1px;
  background:#765b54;
}

.w1{left:-29px;top:77px;transform:rotate(8deg)}
.w2{left:-31px;top:88px;transform:rotate(-5deg)}
.w3{right:-29px;top:77px;transform:rotate(-8deg)}
.w4{right:-31px;top:88px;transform:rotate(5deg)}

.body{
  position:absolute;
  width:108px;
  height:108px;
  left:36px;
  top:126px;
  border-radius:50%;
  background:#d89c73;
  z-index:1;
}

.paw{
  position:absolute;
  width:48px;
  height:32px;
  bottom:-4px;
  background:#e6b28e;
  border-radius:50%;
  z-index:4;
}

.paw.left{left:24px}
.paw.right{right:24px}

.tail{
  position:absolute;
  width:82px;
  height:102px;
  right:-25px;
  bottom:30px;
  border:15px solid #c98961;
  border-left:0;
  border-radius:0 60px 60px 0;
  transform:rotate(-15deg);
  animation:tailMove 2s ease-in-out infinite;
  z-index:0;
}

@keyframes tailMove{
  0%,100%{transform:rotate(-15deg)}
  50%{transform:rotate(12deg)}
}

/* hareket */

.cat.playing{
  animation:jump .5s ease-in-out 3;
}

@keyframes jump{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-30px) rotate(-3deg)}
}

.cat.loving{
  animation:love .5s ease-in-out 3;
}

@keyframes love{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

.cat.sleeping{
  animation:sleep 2s ease-in-out infinite;
}

@keyframes sleep{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(5px) rotate(2deg)}
}

/* =========================
   DURUM
========================= */

.status-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.level{
  background:#292332;
  color:#fff;
  padding:7px 12px;
  border-radius:999px;
  font-size:13px;
}

.small{
  font-size:13px;
  opacity:.6;
}

.xpbar{
  height:9px;
  margin-top:10px;
  background:#eee9f1;
  border-radius:20px;
  overflow:hidden;
}

.xpfill{
  height:100%;
  width:0;
  background:#9b76e8;
  transition:.4s;
}

.stat{
  margin-top:14px;
}

.stat-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  font-size:14px;
}

.bar{
  height:10px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:80%;
  transition:.4s;
}

.hunger{background:#ef9b66}
.energy{background:#79a7ef}
.happiness{background:#ed83aa}
.clean{background:#72c8b0}
.love{background:#e8759d}

/* =========================
   BUTONLAR
========================= */

.actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

button{
  border:0;
  padding:15px 8px;
  border-radius:17px;
  background:#f2edf8;
  color:#292332;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

button:active{
  transform:scale(.94);
}

button.primary{
  background:#292332;
  color:#fff;
}

/* =========================
   PARA / MESAJ
========================= */

.daily{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.coins{
  font-size:18px;
  font-weight:800;
}

.message{
  text-align:center;
  min-height:25px;
  font-weight:700;
}

/* =========================
   YÜKLEME
========================= */

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.97);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99;
  text-align:center;
}

.loading-box{
  padding:30px;
}

.spinner{
  width:35px;
  height:35px;
  margin:0 auto 15px;
  border:4px solid #eee;
  border-top-color:#292332;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.hidden{
  display:none!important;
}

.mode{
  text-align:center;
  font-size:11px;
  opacity:.45;
  margin-top:8px;
}
</style>
</head>

<body>

  <div class="loading-box">

    <div class="spinner"></div>

</div>

<div class="app">

<header class="header">

  <h1>Our Little World</h1>

    Mehmet ❤️ Özlem'in küçük dünyası
  </p>

</header>


<!-- MİŞA -->

<section class="card pet-area">

  <div class="floor"></div>

  <div id="cat" class="cat">

    <div class="tail"></div>

    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="head">

      <div class="eye left"></div>
      <div class="eye right"></div>

      <div class="nose"></div>
      <div class="mouth"></div>

      <div class="whisker w1"></div>
      <div class="whisker w2"></div>
      <div class="whisker w3"></div>
      <div class="whisker w4"></div>

    </div>

    <div class="body"></div>

    <div class="paw left"></div>
    <div class="paw right"></div>

  </div>

</section>


<!-- XP -->

<section class="card">

  <div class="status-title">

    <strong>Mişa</strong>

    <span id="level" class="level">
      Seviye 1
    </span>

  </div>

  <div id="xpText" class="small">
    0 / 100 XP
  </div>

  <div class="xpbar">

    <div id="xpFill" class="xpfill"></div>

  </div>

</section>


<!-- İSTATİSTİKLER -->

<section class="card">

  <div class="stat">

    <div class="stat-row">
      <span>🍖 Açlık</span>
      <b id="hungerText">80</b>
    </div>

    <div class="bar">
      <div id="hunger" class="fill hunger"></div>
    </div>

  </div>


  <div class="stat">

    <div class="stat-row">
      <span>⚡ Enerji</span>
      <b id="energyText">80</b>
    </div>

    <div class="bar">
      <div id="energy" class="fill energy"></div>

  </div>


  <div class="stat">

    <div class="stat-row">
      <span>😊 Mutluluk</span>
      <b id="happinessText">80</b>

    <div class="bar">

    </div>

  </div>


  <div class="stat">

      <span>🛁 Temizlik</span>

  <div class="stat">

    <div class="stat-row">

    </div>

      <div id="love" class="fill love"></div>

</section>


<!-- AKSİYONLAR -->

<section class="card">

    <button onclick="feed()">
      🍖 Besle
    </button>

      🎾 Oyna
    </button>

      ❤️ Sev
    </button>

    <button onclick="cleanPet()">
      🛁 Temizle
    </button>

    <button onclick="sleepPet()">
      😴 Uyut
    </button>

    <button
      class="primary"
      onclick="dailyReward()"
    >
      🎁 Günlük Ödül
    </button>

  </div>

</section>


<!-- PARA -->

<section class="card daily">

  <div>

    <strong>
      🪙 Mişa Parası
    </strong>

    <div class="small">
      Mişa'nın gelişimi için
    </div>

  </div>

  <div id="coins" class="coins">
    100 🪙
  </div>

</section>


<!-- MESAJ -->

<section class="card">

  <div id="message" class="message">
    Mişa seni bekliyor ❤️
  </div>

  <div
    class="small"
    style="text-align:center;margin-top:8px"
  >

    Günlük işlem kotası:
    <b id="quota">20 / 20</b>

  </div>

  <div id="mode" class="mode">
    Hazırlanıyor...
  </div>

</section>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://hfwxmpohclwolzsduor.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Jl_guuDbBsMkzEeqQfBPgw__X9BhqhP";


let supabaseClient = null;
let user = null;
let online = false;


/* =====================================================
   OYUN
===================================================== */

let game = {

  user_id:null,

  pet_name:"Mişa",

  level:1,

  xp:0,

  coins:100,

  hunger:80,

  energy:80,

  happiness:80,

  cleanliness:80,

  love:80,

  total_play:0,

  games_played:0,

  meals_given:0,

  last_daily_reward:null,

  updated_at:null

};


const DAILY_LIMIT = 20;


/* =====================================================
   LOCAL STORAGE
===================================================== */

function localKey(){

  return "misa_game_state";

}


function loadLocal(){

  try{

    const saved =
      localStorage.getItem(
        localKey()
      );

    if(saved){

      const parsed =
        JSON.parse(saved);

      game = {
        ...game,
        ...parsed
      };

    }

  }catch(error){

    console.log(
      "Local veri okunamadı:",
      error
    );

  }

}


function saveLocal(){

  try{

    game.updated_at =
      new Date().toISOString();

    localStorage.setItem(
      localKey(),
      JSON.stringify(game)
    );

  }catch(error){

    console.log(
      "Local kayıt hatası:",
      error
    );

  }

}


/* =====================================================
   SUPABASE BAĞLANTISI
===================================================== */

async function connectSupabase(){

  try{

    if(
      typeof window.supabase ===
      "undefined"
    ){

      throw new Error(
        "Supabase kütüphanesi yüklenmedi."
      );

    }


    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const sessionResult =
      await supabaseClient.auth.getSession();


    if(sessionResult.error){

      throw sessionResult.error;

    }


    let session =
      sessionResult.data.session;


    if(!session){

      const authResult =
        await supabaseClient.auth
          .signInAnonymously();


      if(authResult.error){

        throw authResult.error;

      }


      session =
        authResult.data.session;

    }


    if(!session){

      throw new Error(
        "Oturum oluşturulamadı."
      );

    }


    user =
      session.user;


    online = true;


    console.log(
      "Supabase bağlantısı başarılı:",
      user.id
    );


    await loadGameFromSupabase();


    document.getElementById("mode")
      .textContent =
      "Bulut kayıt aktif";


  }catch(error){

    /*
      EN ÖNEMLİ KISIM:
      Supabase başarısız olsa bile
      uygulama durmayacak.
    */

    console.log(
      "Supabase bağlantısı başarısız:",
      error
    );


    online = false;


    loadLocal();


    document.getElementById("mode")
      .textContent =
      "Yerel kayıt aktif";


  }

}


/* =====================================================
   SUPABASE'DEN OYUNU AL
===================================================== */

async function loadGameFromSupabase(){

  if(!online || !user){
    return;
  }


  const result =
    await supabaseClient
      .from("game_state")
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(result.error){

    throw result.error;

  }


  if(result.data){

    game = {
      ...game,
      ...result.data
    };

    saveLocal();

    return;

  }


  game.user_id =
    user.id;


  const insertResult =
    await supabaseClient
      .from("game_state")
      .insert(game)
      .select()
      .single();


  if(insertResult.error){

    throw insertResult.error;

  }


  game = {
    ...game,
    ...insertResult.data
  };


  saveLocal();

}


/* =====================================================
   KAYDET
===================================================== */

async function saveGame(){

  saveLocal();


  if(
    !online ||
    !supabaseClient ||
    !user
  ){

    return;

  }


  try{

    game.user_id =
      user.id;

    game.updated_at =
      new Date().toISOString();


    const result =
      await supabaseClient
        .from("game_state")
        .update(game)
        .eq(
          "user_id",
          user.id
        );


    if(result.error){

      console.log(
        "Bulut kayıt hatası:",
        result.error
      );

    }

  }catch(error){

    console.log(
      "Supabase kayıt hatası:",
      error
    );

  }

}


/* =====================================================
   KOTA
===================================================== */

function quotaData(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          "misa_quota"
        ) || "{}"
      );


    const today =
      new Date()
        .toISOString()
        .slice(0,10);


    if(saved.date !== today){

      return {
        date:today,
        count:0
      };

    }


    return saved;

  }catch(error){

    return {
      date:new Date()
        .toISOString()
        .slice(0,10),
      count:0
    };

  }

}


function useQuota(){

  const q =
    quotaData();


  if(
    q.count >=
    DAILY_LIMIT
  ){

    showMessage(
      "Bugünkü işlem hakkın doldu ❤️"
    );

    return false;

  }


  q.count++;


  localStorage.setItem(
    "misa_quota",
    JSON.stringify(q)
  );


  render();


  return true;

}


function quotaLeft(){

  return Math.max(
    0,
    DAILY_LIMIT -
    quotaData().count
  );

}


/* =====================================================
   YARDIMCI
===================================================== */

function clamp(value){

  return Math.max(
    0,
    Math.min(
      100,
      Number(value) || 0
    )
  );

}


/* =====================================================
   MİŞA ANİMASYONU
===================================================== */

function animateCat(type){

  const cat =
    document.getElementById(
      "cat"
    );


  cat.classList.remove(
    "playing",
    "loving",
    "sleeping"
  );


  void cat.offsetWidth;


  if(type){

    cat.classList.add(type);

  }


  if(type !== "sleeping"){

    setTimeout(()=>{

      cat.classList.remove(type);

    },1800);

  }

}


/* =====================================================
   GENEL AKSİYON
===================================================== */

async function action(callback){

  if(!useQuota()){

    return;

  }


  callback();


  game.total_play =
    Number(game.total_play || 0) + 1;


  levelCheck();


  render();


  await saveGame();

}


/* =====================================================
   BESLE
===================================================== */

async function feed(){

  await action(()=>{

    if(
      Number(game.coins || 0) < 5
    ){

      showMessage(
        "Mişa'yı beslemek için 5 🪙 gerekiyor."
      );

      return;

    }


    game.coins -= 5;


    game.hunger =
      clamp(
        game.hunger + 18
      );


    game.happiness =
      clamp(
        game.happiness + 3
      );


    game.love =
      clamp(
        game.love + 2
      );


    game.meals_given =
      Number(
        game.meals_given || 0
      ) + 1;


    addXP(8);


    animateCat("loving");


    showMessage(
      "Mişa yemeğini afiyetle yedi! 🍖"
    );

  });

}


/* =====================================================
   OYNA
===================================================== */

async function play(){

  await action(()=>{

    if(
      Number(game.energy) < 12
    ){

      showMessage(
        "Mişa çok yorgun 😴"
      );

      return;

    }


    game.energy =
      clamp(
        game.energy - 12
      );


    game.happiness =
      clamp(
        game.happiness + 18
      );


    game.love =
      clamp(
        game.love + 5
      );


    game.games_played =
      Number(
        game.games_played || 0
      ) + 1;


    addXP(12);


    animateCat("playing");


    showMessage(
      "Mişa seninle oynamaya bayılıyor! 🎾"
    );

  });

}


/* =====================================================
   SEV
===================================================== */

async function lovePet(){

  await action(()=>{

    game.love =
      clamp(
        game.love + 15
      );


    game.happiness =
      clamp(
        game.happiness + 8
      );


    addXP(6);


    animateCat("loving");


    showMessage(
      "Mişa sevildiğini hissediyor ❤️"
    );

  });

}


/* =====================================================
   TEMİZLE
===================================================== */

async function cleanPet(){

  await action(()=>{

    game.cleanliness =
      clamp(
        game.cleanliness + 25
      );


    game.happiness =
      clamp(
        game.happiness + 3
      );


    addXP(7);


    animateCat("loving");


    showMessage(
      "Mişa artık tertemiz! 🛁"
    );

  });

}


/* =====================================================
   UYUT
===================================================== */

async function sleepPet(){

  await action(()=>{

    game.energy =
      clamp(
        game.energy + 30
      );


    game.happiness =
      clamp(
        game.happiness + 4
      );


    addXP(5);


    animateCat("sleeping");


    showMessage(
      "Mişa güzel bir uyku çekti 😴"
    );

  });

}


/* =====================================================
   GÜNLÜK ÖDÜL
===================================================== */

async function dailyReward(){

  const today =
    new Date()
      .toISOString()
      .slice(0,10);


  if(
    game.last_daily_reward ===
    today
  ){

    showMessage(
      "Bugünkü ödülünü zaten aldın 🎁"
    );

    return;

  }


  if(!useQuota()){

    return;

  }


  game.coins =
    Number(game.coins || 0) +
    25;


  game.happiness =
    clamp(
      game.happiness + 5
    );


  game.last_daily_reward =
    today;


  addXP(15);


  render();


  showMessage(
    "+25 Mişa Parası kazandın! 🎁"
  );


  await saveGame();

}


/* =====================================================
   XP
===================================================== */

function addXP(amount){

  game.xp =
    Number(game.xp || 0) +
    Number(amount || 0);


  while(
    game.xp >=
    game.level * 100
  ){

    game.xp -=
      game.level * 100;


    game.level++;


    game.coins =
      Number(game.coins || 0) +
      50;


    showMessage(
      "🎉 Mişa seviye " +
      game.level +
      " oldu! +50 🪙"
    );

  }

}


/* =====================================================
   KONTROL
===================================================== */

function levelCheck(){

  if(
    !game.level ||
    game.level < 1
  ){

    game.level = 1;

  }


  game.hunger =
    clamp(game.hunger);

  game.energy =
    clamp(game.energy);

  game.happiness =
    clamp(game.happiness);

  game.cleanliness =
    clamp(game.cleanliness);

  game.love =
    clamp(game.love);

}


/* =====================================================
   EKRANI GÜNCELLE
===================================================== */

function render(){

  levelCheck();


  document.getElementById(
    "level"
  ).textContent =
    "Seviye " +
    game.level;


  const needed =
    game.level * 100;


  document.getElementById(
    "xpText"
  ).textContent =
    game.xp +
    " / " +
    needed +
    " XP";


  document.getElementById(
    "xpFill"
  ).style.width =
    Math.min(
      100,
      game.xp / needed * 100
    ) + "%";


  setStat("hunger");

  setStat("energy");

  setStat("happiness");

  setStat("cleanliness");

  setStat("love");


  document.getElementById(
    "coins"
  ).textContent =
    Number(game.coins || 0) +
    " 🪙";


  document.getElementById(
    "quota"
  ).textContent =
    quotaLeft() +
    " / " +
    DAILY_LIMIT;

}


/* =====================================================
   STAT
===================================================== */

function setStat(name){

  const value =
    clamp(game[name]);


  const bar =
    document.getElementById(name);


  const text =
    document.getElementById(
      name + "Text"
    );


  bar.style.width =
    value + "%";


  text.textContent =
    Math.round(value);

}


/* =====================================================
   MESAJ
===================================================== */

let messageTimer;


function showMessage(text){

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    text;


  clearTimeout(
    messageTimer
  );


  messageTimer =
    setTimeout(()=>{

      element.textContent =
        "Mişa seni bekliyor ❤️";

    },3000);

}


/* =====================================================
   PASİF ZAMAN
===================================================== */

async function passiveTime(){

  if(!game.updated_at){

    return;

  }


  const last =
    new Date(
      game.updated_at
    );


  const now =
    new Date();


  const minutes =
    Math.floor(
      (now - last) / 60000
    );


  if(
    minutes <= 0
  ){

    return;

  }


  game.hunger =
    clamp(
      game.hunger -
      Math.min(
        15,
        Math.floor(minutes / 30)
      )
    );


  game.energy =
    clamp(
      game.energy -
      Math.min(
        10,
        Math.floor(minutes / 60)
      )
    );


  game.happiness =
    clamp(
      game.happiness -
      Math.min(
        10,
        Math.floor(minutes / 45)
      )
    );


  game.cleanliness =
    clamp(
      game.cleanliness -
      Math.min(
        10,
        Math.floor(minutes / 90)
      )
    );


  render();


  await saveGame();

}


/* =====================================================
   SAYFA AÇILINCA
===================================================== */

document.addEventListener(
  "visibilitychange",
  async()=>{

    if(
      !document.hidden
    ){

      await passiveTime();

    }

  }
);


/* =====================================================
   DAKİKALIK AZALMA
===================================================== */

setInterval(()=>{

  if(
    document.hidden
  ){

    return;

  }


  game.hunger =
    clamp(
      game.hunger - .2
    );


  game.happiness =
    clamp(
      game.happiness - .1
    );


  game.cleanliness =
    clamp(
      game.cleanliness - .05
    );


  game.updated_at =
    new Date().toISOString();


  render();


  saveLocal();

},60000);


/* =====================================================
   BAŞLANGIÇ
===================================================== */

async function start(){

  /*
    Önce yerel veriyi yükle.
    Böylece Supabase hata verse bile
    Mişa açılabilir.
  */

  loadLocal();

  render();

  document.getElementById(
    "mode"
  ).textContent =
    "Başlatılıyor...";


  /*
    Önce ekranı hazırla.
  */

  setTimeout(()=>{

    document
      .getElementById("loading")
      .classList.add("hidden");

  },500);


  /*
    Sonra Supabase'i arka planda dene.
  */

  await connectSupabase();


  render();

}


/* =====================================================
   BAŞLAT
===================================================== */

start();

</script>
