<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mişa | Our Little World</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#fff8f2,#f6f1ff);
  color:#292332;
  min-height:100vh;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:30px;
}

.header{
  padding:22px 18px 12px;
}

.header h1{
  margin:0;
  font-size:30px;
  font-weight:800;
}

.header p{
  margin:5px 0 0;
  font-size:18px;
  opacity:.65;
}

.card{
  margin:12px 16px;
  padding:18px;
  background:rgba(255,255,255,.9);
  border-radius:24px;
  box-shadow:0 10px 30px rgba(40,25,60,.08);
}

.pet-area{
  height:310px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
}

.floor{
  position:absolute;
  bottom:28px;
  width:220px;
  height:35px;
  border-radius:50%;
  background:rgba(70,50,80,.08);
}

.cat{
  position:relative;
  width:170px;
  height:190px;
  animation:breathe 2.5s ease-in-out infinite;
  z-index:2;
}

@keyframes breathe{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

.ear{
  position:absolute;
  width:48px;
  height:58px;
  top:10px;
  background:#d9a47f;
  border-radius:70% 20% 30% 20%;
}

.ear.left{
  left:20px;
  transform:rotate(-25deg);
}

.ear.right{
  right:20px;
  transform:scaleX(-1) rotate(-25deg);
}

.ear:after{
  content:"";
  position:absolute;
  inset:10px;
  background:#f2b6b0;
  border-radius:70% 20% 30% 20%;
}

.head{
  position:absolute;
  width:135px;
  height:125px;
  left:18px;
  top:32px;
  border-radius:48% 48% 45% 45%;
  background:linear-gradient(145deg,#efc09c,#c98961);
  box-shadow:inset -8px -8px 0 rgba(100,50,20,.08);
}

.eye{
  position:absolute;
  top:46px;
  width:16px;
  height:22px;
  background:#292332;
  border-radius:50%;
  animation:blink 5s infinite;
}

.eye.left{left:38px}
.eye.right{right:38px}

@keyframes blink{
  0%,93%,100%{transform:scaleY(1)}
  95%{transform:scaleY(.1)}
}

.eye:after{
  content:"";
  position:absolute;
  width:5px;
  height:5px;
  background:white;
  border-radius:50%;
  top:4px;
  left:4px;
}

.nose{
  position:absolute;
  top:71px;
  left:61px;
  width:13px;
  height:10px;
  background:#9d5360;
  border-radius:50%;
}

.mouth{
  position:absolute;
  top:81px;
  left:59px;
  width:18px;
  height:12px;
  border-bottom:2px solid #59383b;
  border-radius:50%;
}

.whisker{
  position:absolute;
  width:42px;
  height:1px;
  background:#765b54;
  top:77px;
}

.w1{left:-28px;transform:rotate(8deg)}
.w2{left:-30px;top:87px;transform:rotate(-5deg)}
.w3{right:-28px;transform:rotate(-8deg)}
.w4{right:-30px;top:87px;transform:rotate(5deg)}

.body{
  position:absolute;
  width:105px;
  height:105px;
  left:34px;
  top:125px;
  border-radius:50%;
  background:#d89c73;
}

.paw{
  position:absolute;
  width:48px;
  height:32px;
  background:#e6b28e;
  border-radius:50%;
  bottom:-5px;
}

.paw.left{left:22px}
.paw.right{right:22px}

.tail{
  position:absolute;
  width:80px;
  height:100px;
  border:15px solid #c98961;
  border-left:0;
  border-radius:0 60px 60px 0;
  right:-30px;
  bottom:25px;
  transform:rotate(-15deg);
  animation:tail 2s ease-in-out infinite;
}

@keyframes tail{
  0%,100%{transform:rotate(-15deg)}
  50%{transform:rotate(10deg)}
}

.status-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.status-title strong{
  font-size:24px;
}

.level{
  background:#292332;
  color:white;
  padding:9px 14px;
  border-radius:999px;
  font-size:15px;
}

.xpbar{
  height:10px;
  background:#eee9f1;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.xpfill{
  height:100%;
  width:0%;
  background:#9b76e8;
  transition:.3s;
}

.stat{
  margin-top:15px;
}

.stat-row{
  display:flex;
  justify-content:space-between;
  font-size:17px;
  margin-bottom:6px;
}

.bar{
  height:11px;
  border-radius:20px;
  background:#eee;
  overflow:hidden;
}

.fill{
  height:100%;
  width:80%;
  transition:.4s;
}

.hunger{background:#ef9b66}
.energy{background:#79a7ef}
.happiness{background:#ed83aa}
.clean{background:#72c8b0}
.love{background:#e8759d}

.actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

button{
  border:0;
  padding:15px 10px;
  border-radius:17px;
  background:#f2edf8;
  color:#292332;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

button:active{
  transform:scale(.95);
}

button.primary{
  background:#292332;
  color:white;
}

.message{
  text-align:center;
  min-height:24px;
  font-weight:600;
}

.coins{
  font-size:20px;
  font-weight:700;
}

.daily{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.small{
  font-size:13px;
  opacity:.6;
}

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.95);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99;
  font-weight:700;
  text-align:center;
}

.loading-box{
  padding:30px;
}

.hidden{
  display:none!important;
}

.error{
  color:#d33;
  margin-top:12px;
  font-size:14px;
}

@media(max-width:380px){
  .actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="loading" class="loading">
  <div class="loading-box">
    <div style="font-size:55px">🐱</div>
    <div style="font-size:22px;margin-top:10px">
      Mişa hazırlanıyor...
    </div>
  </div>
</div>

<div class="app">

<header class="header">
  <h1>Our Little World</h1>
  <p>Mehmet ❤️ Özlem'in küçük dünyası</p>
</header>

<section class="card pet-area">

  <div class="floor"></div>

  <div class="cat">

    <div class="tail"></div>

    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="head">

      <div class="eye left"></div>
      <div class="eye right"></div>

      <div class="nose"></div>
      <div class="mouth"></div>

      <div class="whisker w1"></div>
      <div class="whisker w2"></div>
      <div class="whisker w3"></div>
      <div class="whisker w4"></div>

    </div>

    <div class="body"></div>

    <div class="paw left"></div>
    <div class="paw right"></div>

  </div>

</section>

<section class="card">

  <div class="status-title">
    <strong>Mişa</strong>
    <span class="level" id="level">Seviye 1</span>
  </div>

  <div class="small" id="xpText">0 / 100 XP</div>

  <div class="xpbar">
    <div class="xpfill" id="xpFill"></div>
  </div>

</section>

<section class="card">

  <div class="stat">
    <div class="stat-row">
      <span>🍖 Açlık</span>
      <b id="hungerText">80</b>
    </div>
    <div class="bar">
      <div id="hunger" class="fill hunger"></div>
    </div>
  </div>

  <div class="stat">
    <div class="stat-row">
      <span>⚡ Enerji</span>
      <b id="energyText">80</b>
    </div>
    <div class="bar">
      <div id="energy" class="fill energy"></div>
    </div>
  </div>

  <div class="stat">
    <div class="stat-row">
      <span>😊 Mutluluk</span>
      <b id="happinessText">80</b>
    </div>
    <div class="bar">
      <div id="happiness" class="fill happiness"></div>
    </div>
  </div>

  <div class="stat">
    <div class="stat-row">
      <span>🛁 Temizlik</span>
      <b id="cleanlinessText">80</b>
    </div>
    <div class="bar">
      <div id="cleanliness" class="fill clean"></div>
    </div>
  </div>

  <div class="stat">
    <div class="stat-row">
      <span>❤️ Sevgi</span>
      <b id="loveText">80</b>
    </div>
    <div class="bar">
      <div id="love" class="fill love"></div>
    </div>
  </div>

</section>

<section class="card">

  <div class="actions">

    <button onclick="feed()">🍖 Mişa'yı Besle</button>

    <button onclick="play()">🎾 Oyna</button>

    <button onclick="lovePet()">❤️ Sev</button>

    <button onclick="cleanPet()">🛁 Temizle</button>

    <button onclick="sleepPet()">😴 Uyut</button>

    <button onclick="dailyReward()" class="primary">
      🎁 Günlük Ödül
    </button>

  </div>

</section>

<section class="card daily">

  <div>
    <strong>🪙 Mişa Parası</strong>
    <div class="small">Gelişim için kullanacağız</div>
  </div>

  <div class="coins" id="coins">100 🪙</div>

</section>

<section class="card">

  <div class="message" id="message">
    Mişa seni bekliyor ❤️
  </div>

  <div class="small" style="text-align:center;margin-top:8px">
    Günlük işlem kotası:
    <b id="quota">20 / 20</b>
  </div>

</section>

</div>

<script>
/* ==============================
   SUPABASE
================================ */

const SUPABASE_URL =
  "https://hfwxmpohclwolzsduor.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Jl_guuDbBsMkzEeqQfBPgw__X9BhqhP";

let client = null;
let user = null;
let game = null;

try {
  if(window.supabase){
    client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );
  }
} catch(error) {
  console.error("Supabase oluşturulamadı:",error);
}

/* ==============================
   AYARLAR
================================ */

const DAILY_LIMIT = 20;

function today(){
  return new Date().toISOString().slice(0,10);
}

/* ==============================
   KOTA
================================ */

function quotaData(){

  let saved = {};

  try{
    saved = JSON.parse(
      localStorage.getItem("misa_quota") || "{}"
    );
  }catch(e){}

  if(saved.date !== today()){

    return {
      date:today(),
      count:0
    };

  }

  return saved;
}

function quotaLeft(){

  return Math.max(
    0,
    DAILY_LIMIT - quotaData().count
  );

}

function useQuota(){

  const q = quotaData();

  if(q.count >= DAILY_LIMIT){

    showMessage(
      "Bugünkü kotan doldu ❤️ Yarın tekrar devam edebilirsin."
    );

    return false;

  }

  q.count++;

  localStorage.setItem(
    "misa_quota",
    JSON.stringify(q)
  );

  renderQuota();

  return true;
}

function renderQuota(){

  const el =
    document.getElementById("quota");

  if(el){

    el.textContent =
      quotaLeft() + " / " + DAILY_LIMIT;

  }

}

/* ==============================
   BAŞLANGIÇ
================================ */

async function start(){

  try{

    /*
      Supabase çalışıyorsa kullanıcı oluşturmaya çalış.
      Çalışmazsa uygulama yine de açılır.
    */

    if(client){

      let sessionResult =
        await client.auth.getSession();

      if(
        !sessionResult.error &&
        sessionResult.data &&
        sessionResult.data.session
      ){

        user =
          sessionResult.data.session.user;

        await loadGame();

      }else{

        const authResult =
          await client.auth.signInAnonymously();

        if(
          !authResult.error &&
          authResult.data &&
          authResult.data.user
        ){

          user =
            authResult.data.user;

          await loadGame();

        }else{

          console.warn(
            "Anonymous giriş yapılamadı. Yerel kayıt kullanılacak."
          );

          loadLocalGame();

        }

      }

    }else{

      loadLocalGame();

    }

  }catch(error){

    console.warn(
      "Supabase bağlantısı başarısız:",
      error
    );

    /*
      Supabase hata verse bile Mişa açılacak.
    */

    loadLocalGame();

  }

  render();

  document
    .getElementById("loading")
    .classList.add("hidden");

}

/* ==============================
   OYUN VERİSİ
================================ */

function defaultGame(){

  return {

    user_id:null,

    pet_name:"Mişa",

    level:1,

    xp:0,

    coins:100,

    hunger:80,

    energy:80,

    happiness:80,

    cleanliness:80,

    love:80,

    total_play:0,

    games_played:0,

    meals_given:0,

    last_daily_reward:null,

    updated_at:new Date().toISOString()

  };

}

/* ==============================
   SUPABASE'DEN YÜKLE
================================ */

async function loadGame(){

  if(!client || !user){

    loadLocalGame();

    return;

  }

  const result =
    await client
      .from("game_state")
      .select("*")
      .eq("user_id",user.id)
      .maybeSingle();

  if(result.error){

    console.warn(
      "game_state okunamadı:",
      result.error
    );

    loadLocalGame();

    return;

  }

  if(result.data){

    game = result.data;

  }else{

    game = defaultGame();

    game.user_id =
      user.id;

    const insertResult =
      await client
        .from("game_state")
        .insert(game)
        .select()
        .single();

    if(insertResult.error){

      console.warn(
        "Oyun oluşturulamadı:",
        insertResult.error
      );

      loadLocalGame();

    }else{

      game =
        insertResult.data;

    }

  }

}

/* ==============================
   YEREL KAYIT
================================ */

function loadLocalGame(){

  try{

    const saved =
      localStorage.getItem("misa_game");

    if(saved){

      game =
        JSON.parse(saved);

    }else{

      game =
        defaultGame();

    }

  }catch(error){

    game =
      defaultGame();

  }

}

function saveLocal(){

  if(!game) return;

  game.updated_at =
    new Date().toISOString();

  try{

    localStorage.setItem(
      "misa_game",
      JSON.stringify(game)
    );

  }catch(error){

    console.error(
      "Yerel kayıt hatası:",
      error
    );

  }

}

/* ==============================
   KAYDET
================================ */

async function save(){

  if(!game) return;

  game.updated_at =
    new Date().toISOString();

  saveLocal();

  if(!client || !user){

    return;

  }

  try{

    const result =
      await client
        .from("game_state")
        .update(game)
        .eq("user_id",user.id);

    if(result.error){

      console.warn(
        "Supabase kayıt hatası:",
        result.error
      );

    }

  }catch(error){

    console.warn(
      "Supabase kayıt yapılamadı:",
      error
    );

  }

}

/* ==============================
   YARDIMCI
================================ */

function clamp(value){

  return Math.max(
    0,
    Math.min(100,Number(value) || 0)
  );

}

function addXP(amount){

  game.xp += amount;

  while(
    game.xp >= game.level * 100
  ){

    game.xp -=
      game.level * 100;

    game.level++;

    game.coins += 50;

    showMessage(
      "🎉 Mişa seviye " +
      game.level +
      " oldu! +50 Mişa Parası!"
    );

  }

}

/* ==============================
   AKSİYON
================================ */

async function action(callback){

  if(!useQuota()) return;

  const beforeMessage =
    document.getElementById("message").textContent;

  callback();

  game.total_play++;

  levelCheck();

  render();

  await save();

}

/* ==============================
   BESLE
================================ */

async function feed(){

  await action(()=>{

    if(game.coins < 5){

      showMessage(
        "Mişa için yeterli paran yok 🪙"
      );

      return;

    }

    game.coins -= 5;

    game.hunger =
      clamp(game.hunger + 18);

    game.happiness =
      clamp(game.happiness + 3);

    game.love =
      clamp(game.love + 2);

    game.meals_given++;

    addXP(8);

    showMessage(
      "Mişa yemeğini afiyetle yedi! 🍖"
    );

  });

}

/* ==============================
   OYNA
================================ */

async function play(){

  await action(()=>{

    if(game.energy < 12){

      showMessage(
        "Mişa çok yorgun. Biraz uyuması gerekiyor 😴"
      );

      return;

    }

    game.energy =
      clamp(game.energy - 12);

    game.happiness =
      clamp(game.happiness + 18);

    game.love =
      clamp(game.love + 5);

    game.games_played++;

    addXP(12);

    showMessage(
      "Mişa seninle oynamaya bayılıyor! 🎾"
    );

  });

}

/* ==============================
   SEV
================================ */

async function lovePet(){

  await action(()=>{

    game.love =
      clamp(game.love + 15);

    game.happiness =
      clamp(game.happiness + 8);

    addXP(6);

    showMessage(
      "Mişa sevildiğini hissediyor ❤️"
    );

  });

}

/* ==============================
   TEMİZLE
================================ */

async function cleanPet(){

  await action(()=>{

    game.cleanliness =
      clamp(game.cleanliness + 25);

    game.happiness =
      clamp(game.happiness + 3);

    addXP(7);

    showMessage(
      "Mişa artık tertemiz! 🛁"
    );

  });

}

/* ==============================
   UYUT
================================ */

async function sleepPet(){

  await action(()=>{

    game.energy =
      clamp(game.energy + 30);

    game.happiness =
      clamp(game.happiness + 4);

    addXP(5);

    showMessage(
      "Mişa güzel bir uyku çekti 😴"
    );

  });

}

/* ==============================
   GÜNLÜK ÖDÜL
================================ */

async function dailyReward(){

  const todayDate =
    today();

  if(
    game.last_daily_reward ===
    todayDate
  ){

    showMessage(
      "Bugünkü ödülünü zaten aldın 🎁"
    );

    return;

  }

  if(!useQuota()) return;

  game.coins += 25;

  game.happiness =
    clamp(game.happiness + 5);

  game.last_daily_reward =
    todayDate;

  addXP(15);

  showMessage(
    "Günlük ödülün: +25 Mişa Parası 🎁"
  );

  levelCheck();

  render();

  await save();

}

/* ==============================
   SEVİYE / DEĞERLER
================================ */

function levelCheck(){

  if(game.level < 1){

    game.level = 1;

  }

  game.hunger =
    clamp(game.hunger);

  game.energy =
    clamp(game.energy);

  game.happiness =
    clamp(game.happiness);

  game.cleanliness =
    clamp(game.cleanliness);

  game.love =
    clamp(game.love);

}

/* ==============================
   EKRANA YAZ
================================ */

function render(){

  if(!game) return;

  levelCheck();

  document
    .getElementById("level")
    .textContent =
      "Seviye " + game.level;

  const needed =
    game.level * 100;

  document
    .getElementById("xpText")
    .textContent =
      game.xp +
      " / " +
      needed +
      " XP";

  document
    .getElementById("xpFill")
    .style.width =
      Math.min(
        100,
        (game.xp / needed) * 100
      ) + "%";

  setStat("hunger");
  setStat("energy");
  setStat("happiness");
  setStat("cleanliness");
  setStat("love");

  document
    .getElementById("coins")
    .textContent =
      game.coins + " 🪙";

  renderQuota();

}

/* ==============================
   STAT
================================ */

function setStat(name){

  const value =
    Math.round(game[name]);

  const bar =
    document.getElementById(name);

  const text =
    document.getElementById(
      name + "Text"
    );

  if(bar){

    bar.style.width =
      value + "%";

  }

  if(text){

    text.textContent =
      value;

  }

}

/* ==============================
   MESAJ
================================ */

let messageTimer = null;

function showMessage(text){

  const el =
    document.getElementById("message");

  if(!el) return;

  el.textContent =
    text;

  clearTimeout(messageTimer);

  messageTimer =
    setTimeout(()=>{

      el.textContent =
        "Mişa seni bekliyor ❤️";

    },3000);

}

/* ==============================
   ZAMANLA AZALMA
================================ */

async function passiveTime(){

  if(!game) return;

  const last =
    new Date(
      game.updated_at ||
      Date.now()
    );

  const now =
    new Date();

  const minutes =
    Math.floor(
      (now - last) / 60000
    );

  if(minutes <= 0) return;

  const hungerLoss =
    Math.min(
      15,
      Math.floor(minutes / 30)
    );

  const energyLoss =
    Math.min(
      10,
      Math.floor(minutes / 60)
    );

  const happinessLoss =
    Math.min(
      10,
      Math.floor(minutes / 45)
    );

  const cleanLoss =
    Math.min(
      10,
      Math.floor(minutes / 90)
    );

  game.hunger =
    clamp(
      game.hunger -
      hungerLoss
    );

  game.energy =
    clamp(
      game.energy -
      energyLoss
    );

  game.happiness =
    clamp(
      game.happiness -
      happinessLoss
    );

  game.cleanliness =
    clamp(
      game.cleanliness -
      cleanLoss
    );

  render();

  await save();

}

/* ==============================
   SAYFA GERİ GELİNCE
================================ */

document.addEventListener(
  "visibilitychange",
  async()=>{

    if(!document.hidden){

      await passiveTime();

    }

  }
);

/* ==============================
   DAKİKALIK AZALMA
================================ */

setInterval(async()=>{

  if(
    !document.hidden &&
    game
  ){

    game.hunger =
      clamp(game.hunger - .2);

    game.happiness =
      clamp(game.happiness - .1);

    game.cleanliness =
      clamp(game.cleanliness - .05);

    render();

    await save();

  }

},60000);

/* ==============================
   HATA YAKALAMA
================================ */

window.addEventListener(
  "error",
  function(event){

    console.error(
      "JavaScript hatası:",
      event.error || event.message
    );

  }
);

/* ==============================
   BAŞLAT
================================ */

renderQuota();

start();

</script>
